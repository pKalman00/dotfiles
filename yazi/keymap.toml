# Mount.yazi plugin
[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

# Drag-and-drop out of yazi
[[mgr.prepend_keymap]]
on  = "<C-n>"
run = 'shell -- dragon-drop -x -i -T "$s"'

# Ouch plugin
[[mgr.prepend_keymap]]
on = "C"
run = "plugin ouch"
desc = "Compress with ouch"

# Chmod plugin
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

# Recycle-bin plugin
[[mgr.prepend_keymap]]
on = [ "R", "b"]
run = "plugin recycle-bin"

# wl-clipboard plugin
[[mgr.prepend_keymap]]
on = "<C-y>"
run = "plugin wl-clipboard"

