###########
# GPU API # 
###########

# gpu-api=vulkan
# gpu-api=d3d11
gpu-api=opengl
# gpu-context=waylandvk

##########
# Player #
##########

hr-seek-framedrop=no
msg-color=yes
msg-module=yes

###############
# Screenshots #
###############

screenshot-directory=~/Pictures/mpv/
screenshot-template="Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"
screenshot-format=png
screenshot-png-compression=4
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=no
# screenshot-high-bit-depth=yes	# Same output bitdepth as the video

###########
# OSC/OSD #
###########

osc=no
osd-bar=no
osd-font='Inter Tight Medium'			# Set a font for OSC
osd-font-size=30				# Set a font size

########
# Subs #
########

blend-subtitles=no
sub-ass-vsfilter-blur-compat=yes
sub-ass-scale-with-window=no
sub-auto=fuzzy
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles
demuxer-mkv-subtitle-preroll=yes
embeddedfonts=yes
sub-fix-timing=no

# Subs - Forced # 

sub-font=Open Sans SemiBold
sub-font-size=46
sub-blur=0.3
sub-border-color=0.0/0.0/0.0/0.8
sub-border-size=3.2
sub-color=0.9/0.9/0.9/1.0
sub-margin-x=100
sub-margin-y=50

#########
# Audio #
#########

volume-max=200
audio-stream-silence
audio-file-auto=fuzzy
audio-pitch-correction=yes

# 5.1
# audio-channels=5.1
# af=drc=1

# stereo downmix
audio-channels=stereo
af=lavrresample=normalize=yes

# Languages #
alang=eng,en,enUS,en-US,jpn,jp
slang=eng,en

##################
# Video Profiles #
##################

profile=high-quality
hwdec=auto-copy
vo=gpu-next

###### Dither
dither-depth=auto

###### Debanding
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4

###### Luma up (uncomment one shader line only)	See: https://artoriuz.github.io/blog/mpv_upscaling.html
glsl-shader="~~/shaders/ravu-zoom-ar-r3-rgb.hook"
scale=ewa_lanczos
scale-blur=0.981251

###### Luma down (optional, uncomment shader line if your hardware can support it)
dscale=catmull_rom
correct-downscaling=yes
linear-downscaling=no

###### Chroma up + down (optional, uncomment one shader line only if your hardware can support it)
# glsl-shader="~~/shaders/JointBilateral.glsl"
# glsl-shader="~~/shaders/FastBilateral.glsl"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
cscale=lanczos
sigmoid-upscaling=yes

###### Interpolation
video-sync=display-resample
interpolation=yes
tscale=sphinx
tscale-blur=0.6991556596428412
tscale-radius=1.05
tscale-clamp=0.0

###### SDR
tone-mapping=bt.2446a

###### HDR
target-colorspace-hint=yes

############
# Playback #
############

deinterlace=no # global reset of deinterlacing to off
loop-playlist=no
correct-downscaling=yes
linear-downscaling=yes

