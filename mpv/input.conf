UP          add volume 5
DOWN        add volume -5
.           frame-step
,           frame-back-step
LEFT        seek -5
RIGHT       seek 5
a           cycle audio
s           cycle sub
t           script-message-to seek_to toggle-seeker
f           cycle fullscreen
+           add audio-delay 0.010
-           add audio-delay -0.010
F1          add sub-delay -0.1
F2          add sub-delay +0.1
Shift+LEFT   add chapter -1
Shift+RIGHT  add chapter 1
p           screenshot