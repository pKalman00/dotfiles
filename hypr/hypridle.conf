general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.disp.dpms({ action = "enable" })'
}

# Dim the screen and turn off keyboard backlight
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10% && brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -r && brightnessctl -rd asus::kbd_backlight
}

# Turn off screen
listener {
    timeout = 180
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r && brightnessctl -rd asus::kbd_backlight
}

# Lock the screen
listener {
    timeout = 185
    on-timeout = loginctl lock-session
}

# Suspend the system
listener {
    timeout = 600
    on-timeout = systemctl suspend
}

