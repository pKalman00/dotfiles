general{
    disable_loading_bar = true
    hide_cursor = true
}

background {
  monitor =
    path = $HOME/Pictures/wall-cybersnake-16.png
    blur_passes = 1
    blur_size = 3
    vibrancy = 0.5
    vibrancy_darkness = 0.5
}

