# cursor
cursor none
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

#font
font size 11
font_family CaskaydiaCove Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
force_ltr no

# shell
shell fish --login
shell_integration enabled no-cursor

# window
remember_window_size no
initial_window_width 103c
initial_window_height 31c
window_padding_width 3
# background_opacity 0.95
background_opacity 0.8
background_blur 0

# misc
mouse_hide_wait -1
scrollback_lines 10000
enable_audio_bell no

# colors primary
background #192330
foreground #cdcecf

# colors normal
color0 #393b44
color1 #c94f6d
color2 #81b29a
color3 #dbc074
color4 #719cd6
color5 #9d79d6
color6 #63cdcf
color7 #dfdfe0

# colors bright
color8  #575860
color9  #d16983
color10 #8ebaa4
color11 #e0c989
color12 #86abdc
color13 #baa1e2
color14 #7ad5d6
color15 #e4e4e5
